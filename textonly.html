<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Tekst Test</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto&family=Montserrat&family=Pacifico&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #111; color: white; font-family: sans-serif; }
#preview {
  position: relative;
  width: 100%;
  aspect-ratio: 9/16;
  background: #000;
  overflow: hidden;
}
canvas { width: 100%; height: 100%; display: block; }
#overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}
.titem {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  white-space: nowrap;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
}
#controls { padding: 16px; }
input[type=text] {
  width: 100%; padding: 12px; font-size: 16px;
  background: #222; color: white; border: 1px solid #444;
  border-radius: 8px; margin-bottom: 10px; display: block;
}
button {
  width: 100%; padding: 14px; background: #00d4aa;
  border: none; border-radius: 8px; font-size: 14px;
  font-weight: bold; cursor: pointer; margin-bottom: 8px;
}
#status { font-size: 12px; color: #888; margin-top: 8px; }
</style>
</head>
<body>
<div id="preview">
  <canvas id="c" width="360" height="640"></canvas>
  <div id="overlay"></div>
</div>
<div id="controls">
  <input type="text" id="inp" placeholder="Skriv din tekst her...">
  <button onclick="addToOverlay()">Vis tekst som HTML overlay</button>
  <button onclick="drawOnCanvas()" style="background:#ff6b35">Vis tekst på canvas</button>
  <div id="status">Klar</div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const inp = document.getElementById('inp');
const status = document.getElementById('status');

// Draw grey background on canvas
ctx.fillStyle = '#222';
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = '#444';
ctx.font = '20px sans-serif';
ctx.textAlign = 'center';
ctx.fillText('Canvas baggrund', canvas.width/2, canvas.height/2);

function addToOverlay() {
  const txt = inp.value;
  if (!txt) { status.textContent = '❌ Ingen tekst'; return; }
  
  overlay.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'titem';
  el.textContent = txt;
  el.style.top = '80%';
  el.style.fontSize = '40px';
  el.style.fontFamily = 'Roboto, sans-serif';
  el.style.color = '#ffffff';
  el.style.fontWeight = 'bold';
  overlay.appendChild(el);
  
  status.textContent = '✅ HTML overlay: "' + txt + '"';
}

function drawOnCanvas() {
  const txt = inp.value;
  if (!txt) { status.textContent = '❌ Ingen tekst'; return; }
  
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.font = 'bold 48px Roboto, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 10;
  ctx.fillText(txt, canvas.width/2, canvas.height * 0.8);
  ctx.restore();
  
  status.textContent = '✅ Canvas: "' + txt + '"';
}

// Live update overlay as you type
inp.addEventListener('input', () => {
  if (inp.value) addToOverlay();
});
</script>
</body>
</html>
