<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body { background: #111; margin: 0; padding: 20px; font-family: sans-serif; color: white; }
canvas { display: block; width: 100%; border: 2px solid #00d4aa; border-radius: 8px; }
input { display: block; width: 100%; margin-top: 10px; padding: 10px; font-size: 18px; background: #222; color: white; border: 1px solid #444; border-radius: 8px; box-sizing: border-box; }
button { margin-top: 10px; padding: 12px 20px; background: #00d4aa; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; width: 100%; }
#log { margin-top: 10px; font-size: 11px; color: #888; }
</style>
</head>
<body>
<canvas id="c" width="360" height="640"></canvas>
<input id="inp" type="text" placeholder="Skriv noget her...">
<button onclick="drawNow()">Tegn tekst manuelt</button>
<div id="log">Klar</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const inp = document.getElementById('inp');
const log = document.getElementById('log');

function drawNow() {
  const txt = inp.value || 'Test tekst';
  log.textContent = 'Tegner: "' + txt + '" canvas=' + canvas.width + 'x' + canvas.height;
  
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.save();
  ctx.font = 'bold 48px sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,0.9)';
  ctx.shadowBlur = 10;
  ctx.globalAlpha = 1;
  ctx.fillText(txt, canvas.width / 2, canvas.height * 0.8);
  ctx.restore();
  
  log.textContent += ' ✅ Tegnet!';
}

// Auto-tegn når man skriver
inp.addEventListener('input', drawNow);

// Tegn noget med det samme
drawNow();
</script>
</body>
</html>
